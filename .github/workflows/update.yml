name: update-jobs
on: {schedule: [{cron: "0 5 * * *"}], workflow_dispatch: {}}
permissions: {contents: write}
jobs: {update: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-python@v5, with: {python-version: "3.12"}}, {run: pip install -r requirements.txt}, {run: python scraper/jobboard.py}, {name: Telegram, env: {TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}", TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"}, run: python scraper/notify.py}, {name: Guardar, run: "git config user.name jobboard-bot && git config user.email bot@users.noreply.github.com && git add docs/jobs.json docs/new_jobs.json ats_cache.json && (git diff --cached --quiet || git commit -m 'Update jobs') && git pull --rebase origin main && git push"}]}}
